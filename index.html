<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlassenCheck – Kio</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(140deg,#101a35,#263a62);color:white;text-align:center;min-height:100vh;margin:0;padding:25px 16px;box-sizing:border-box}main{max-width:520px;margin:auto}h1{font-size:28px}button{font:inherit;font-weight:650;padding:15px 20px;margin:7px;border:0;border-radius:14px;background:#79d9f0;color:#0a1930;cursor:pointer}button:focus-visible{outline:3px solid white}.avatar{font-size:100px;display:inline-block;transition:transform .5s}.avatar.move{transform:translateX(26px) rotate(8deg)}.panel{background:#ffffff14;padding:22px;border-radius:22px;margin:20px 0}#message{min-height:55px;font-size:19px}small{color:#cbd5e1}</style></head>
<body><main><h1>KlassenCheck – Kio</h1><div id="kio" class="avatar" role="img" aria-label="Vorläufiger Kio-Platzhalter">🧑‍🚀</div><div class="panel"><p id="message" aria-live="polite">Hallo! Ich bin Kio. Tippe auf „Kio sprechen“.</p><button id="speak">🔊 Kio sprechen</button><button id="move">Kio bewegen</button><p id="status"><small>Sprachausgabe nutzt die Stimmen deines Geräts.</small></p></div><div class="panel"><h2>Was ist größer?</h2><button id="correct">½</button><button id="wrong">¼</button></div><small>Früher Technik-Prototyp – 3D-Avatar und hochwertige Stimme folgen.</small></main>
<script>
const msg=document.getElementById('message');let voice=null;
function chooseVoice(){if(!('speechSynthesis' in window))return;const voices=speechSynthesis.getVoices();voice=voices.find(v=>v.lang.toLowerCase().startsWith('de')&&/premium|enhanced/i.test(v.name))||voices.find(v=>v.lang.toLowerCase().startsWith('de'))||null;}
if('speechSynthesis' in window){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice;}
function say(t){msg.textContent=t;if(!('speechSynthesis' in window)){document.getElementById('status').textContent='Sprachausgabe wird von diesem Browser nicht unterstützt.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.95;u.pitch=1.05;if(voice)u.voice=voice;u.onerror=()=>{document.getElementById('status').textContent='Ton nicht verfügbar. Bitte Lautstärke und iPhone-Stimmeinstellungen prüfen.'};speechSynthesis.speak(u);}
document.getElementById('speak').addEventListener('click',()=>say('Hallo! Ich bin Kio. Willkommen bei KlassenCheck. Lass uns zusammen Mathe entdecken!'));
document.getElementById('move').addEventListener('click',()=>{document.getElementById('kio').classList.toggle('move');say('Ich bin bereit für unsere nächste Mission!')});
document.getElementById('correct').addEventListener('click',()=>say('Richtig! Ein Halb ist größer als ein Viertel. Super gemacht!'));
document.getElementById('wrong').addEventListener('click',()=>say('Fast! Stell dir eine Pizza vor: Ein Halb ist mehr als ein Viertel. Versuch es noch einmal.'));
</script></body></html>
