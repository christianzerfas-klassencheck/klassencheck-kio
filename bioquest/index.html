['🔬 Knochenaufbau','Röhrenknochen besitzen einen festen Knochenschaft und eine Markhöhle. Knochenbälkchen machen die Knochen leicht und stabil. Die Knochenhaut enthält Nerven und Blutgefäße. Rotes Knochenmark bildet Blutzellen.',['Warum sind Knochen leicht und stabil?','Wegen der Knochenbälkchen','Wegen der Gelenkschmiere','Wegen der Bandscheiben',1],['Was entsteht im roten Knochenmark?','Sehnen','Blutzellen','Gelenkknorpel',2]],

];let points=Number(localStorage.getItem('bq_points')||0),done=JSON.parse(localStorage.getItem('bq_done')||'{}'),unit=0,q=0,score=0;const app=document.getElementById('app');function update(){document.getElementById('points').textContent=points+' Lernpunkte · '+Object.keys(done).length+'/7 Missionen'}function home(){update();app.innerHTML='<article><h2>Deine 7 Lernwelten</h2><p>Wähle eine Mission. Lies die Erklärung und beantworte die Fragen.</p></article>'+units.map((u,i)=>'<button data-unit="'+i+'">'+u[0]+(done[i]?' ✓':'')+'</button>').join('')+'<article><button class="primary" id="test">🏆 Abschlussprüfung starten</button></article>';document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>lesson(+b.dataset.unit));document.getElementById('test').onclick=()=>exam()}

function renderQuestion(x,number,total,onAnswer){app.innerHTML='<article><p class="quizmeta">FRAGE '+number+' / '+total+'</p><div class="statbar"><div style="width:'+(100*(number-1)/total)+'%"></div></div><h2>'+x[0]+'</h2>'+x.slice(1,4).map((a,i)=>'<button data-answer="'+(i+1)+'">'+a+'</button>').join('')+'<div id="answer-feedback"></div></article>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const f=document.getElementById('answer-feedback');if(f.innerHTML)return;const ok=Number(b.dataset.answer)===x[4];document.querySelectorAll('[data-answer]').forEach(t=>{t.disabled=true;if(Number(t.dataset.answer)===x[4])t.classList.add('correct');else if(t===b)t.classList.add('wrong')});f.innerHTML='<p><strong>'+(ok?'✓ Richtig!':'Noch nicht richtig.')+'</strong> Richtige Antwort: '+x[x[4]]+'</p><button class="primary" id="continue">Weiter →</button>';document.getElementById('continue').onclick=()=>onAnswer(ok)})}
function runSession(items,label,world){let idx=0,correct=0;function next(){if(idx>=items.length){if(world!==null&&!done[world]){done[world]=true;points+=correct*5+20;localStorage.setItem('bq_done',JSON.stringify(done));localStorage.setItem('bq_points',points)}app.innerHTML='<article><h2>🏅 '+label+' geschafft!</h2><p><strong>'+correct+' von '+items.length+'</strong> Antworten richtig ('+Math.round(100*correct/items.length)+' %).</p><p>'+(correct/items.length>=.8?'Sehr gut! Du beherrschst die meisten Fragen.':'Wiederhole die Lernwelt und versuche das Training noch einmal.')+'</p><button class="primary" id="back">Zur Übersicht</button></article>';document.getElementById('back').onclick=home;update();return}renderQuestion(items[idx],idx+1,items.length,ok=>{if(ok)correct++;idx++;next()})}next()}
function startWorld(i){unit=i;const items=[...units[i].slice(2),...questionBank[i]];runSession(items,units[i][0],i)}
function startMixed(count){const all=questionBank.flatMap((questions,i)=>[...units[i].slice(2),...questions]);const shuffled=all.map((x,i)=>({x,k:(i*37+11)%all.length})).sort((a,b)=>a.k-b.k).map(o=>o.x);runSession(shuffled.slice(0,count),count===all.length?'Große Abschlussprüfung':'Gemischtes Training',null)}
