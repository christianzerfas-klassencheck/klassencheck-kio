<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioQuest – Klasse 6</title><style>body{font:17px system-ui;background:#edf4f4;color:#17333c;margin:0}main{max-width:650px;margin:auto;padding:18px}header{background:#134b56;color:white;padding:25px;border-radius:18px}h1{margin:4px 0}article{background:white;border-radius:15px;padding:19px;margin:13px 0;box-shadow:0 2px 9px #0001}button{display:block;width:100%;padding:15px;margin:9px 0;border:1px solid #bfd2d2;border-radius:12px;background:white;color:#17333c;text-align:left;font:inherit;cursor:pointer;min-height:48px}button.primary{background:#146f67;color:white;text-align:center;font-weight:bold}.small{color:#5b7378;font-size:14px}.correct{background:#dcf5e4}.wrong{background:#fce1e1}p{line-height:1.6}</style><style>
:root{color-scheme:light}body{background:linear-gradient(160deg,#e8f3f2,#f5f6fc 70%)}header{background:linear-gradient(125deg,#0e4451,#157f76);box-shadow:0 12px 30px #124d4d24}header h1{font-size:clamp(29px,7vw,43px)}article{border:1px solid #e2ebec}button{transition:transform .12s,background .12s}button:active{transform:scale(.985)}button:focus-visible{outline:3px solid #ffb84d;outline-offset:2px}.hero-art{width:100%;height:230px;display:block;background:radial-gradient(circle at 50% 45%,#e1f7f0,#f4fafb);border-radius:15px;margin:16px 0}.topic{display:flex;align-items:center;gap:12px}.topic span{flex:1}.pill{font-size:12px;background:#e0f5ee;color:#176352;border-radius:20px;padding:5px 9px}.statbar{height:10px;background:#cde0df;border-radius:20px;overflow:hidden;margin-top:12px}.statbar div{height:100%;background:#ffcf70;transition:width .3s}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two button{font-size:14px;text-align:center}.fact{padding:13px;border-radius:12px;background:#eff8f5;border-left:4px solid #1a8b76}.quizmeta{font-size:13px;color:#557478;font-weight:700;letter-spacing:.05em}#feedback p,#f p{padding:12px;border-radius:10px;background:#f0f8f4}.caption{font-size:13px;color:#527079;text-align:center}.muted{color:#557478}footer{text-align:center;padding:20px;color:#648187;font-size:12px}@media(prefers-reduced-motion:reduce){button,.statbar div{transition:none}}
</style><main><header><small>BIOQUEST · BIOLOGIE · OBS KLASSE 6</small><h1>🦴 Mission Körperbau</h1><div id="points">0 Lernpunkte</div></header><section id="app"></section></main><script>
const units=[
['🦴 Das Skelett','Das Skelett stützt den Körper, schützt wichtige Organe und ermöglicht mit Gelenken und Muskeln Bewegung. Es besteht aus Kopfskelett, Rumpfskelett und Gliedmaßenskelett.',['Was schützt der Schädel?','Das Gehirn','Die Lunge','Den Magen',1],['Was gehört zum Gliedmaßenskelett?','Arme und Beine','Rippen','Schädel',1]],
['🔬 Knochenaufbau','Röhrenknochen besitzen einen festen Knochenschaft und eine Markhöhle. Knochenbälkchen machen die Knochen leicht und stabil. Die Knochenhaut enthält Nerven und Blutgefäße. Rotes Knochenmark bildet Blutzellen.',['Warum sind Knochen leicht und stabil?','Wegen der Knochenbälkchen','Wegen der Gelenkschmiere','Wegen der Bandscheiben',1],['Was entsteht im roten Knochenmark?','Sehnen','Blutzellen','Gelenkknorpel',2]],
['🧍 Die Wirbelsäule','Die Wirbelsäule hat 7 Halswirbel, 12 Brustwirbel und 5 Lendenwirbel sowie Kreuzbein und Steißbein. Ihre doppelte S-Form federt Stöße ab. Bandscheiben liegen zwischen den beweglichen Wirbeln. Der Wirbelkanal schützt das Rückenmark.',['Wie viele Halswirbel gibt es?','5','7','12',2],['Wozu dienen Bandscheiben?','Stöße abfedern','Blut bilden','Knochen wachsen lassen',1]],
['🦶 Das Fußgewölbe','Das Fußgewölbe ähnelt einer Bogenbrücke. Es verteilt das Gewicht und federt Stöße ab. Beim Senkfuß ist die Wölbung abgesenkt. Hohe Absätze verlagern Gewicht nach vorne.',['Wozu dient das Fußgewölbe?','Es federt Stöße ab','Es bildet Blutzellen','Es bewegt den Kopf',1],['Was ist ein Senkfuß?','Ein Fuß ohne Zehen','Ein abgesenktes Fußgewölbe','Ein Fuß ohne Gelenke',2]],
['⚙️ Gelenke','Gelenke verbinden Knochen beweglich. Gelenkkopf und Gelenkpfanne passen zusammen. Knorpel und Gelenkschmiere vermindern Reibung. Die Gelenkkapsel umschließt das Gelenk, Bänder stabilisieren es. Gelenktypen: Scharnier (Ellenbogen), Kugel (Schulter), Dreh (Hals) und Sattel (Daumen).',['Welches Gelenk sitzt am Ellenbogen?','Kugelgelenk','Scharniergelenk','Sattelgelenk',2],['Was vermindert Reibung im Gelenk?','Knorpel und Gelenkschmiere','Knochenmark','Rückenmark',1]],
['💪 Muskeln und Sehnen','Der Körper besitzt über 600 Muskeln. Muskeln bestehen aus Muskelfaserbündeln und Muskelfasern. Sehnen verbinden Muskeln mit Knochen. Muskeln ziehen sich zusammen und verkürzen sich. Nerven steuern die Bewegung. Für die Arbeit benötigen Muskeln Energie, Sauerstoff und Nährstoffe.',['Was verbindet Muskel und Knochen?','Sehne','Bandscheibe','Gelenkschmiere',1],['Was macht ein Muskel beim Zusammenziehen?','Er verkürzt sich','Er wird zu Knochen','Er löst sich auf',1]],
['🏋️ Gegenspielerprinzip','Bizeps und Trizeps sind Gegenspieler. Beim Beugen zieht sich der Bizeps zusammen und der Trizeps wird gedehnt. Beim Strecken zieht sich der Trizeps zusammen und der Bizeps wird gedehnt. Muskeln können aktiv ziehen, aber nicht schieben.',['Welcher Muskel beugt den Ellenbogen?','Trizeps','Bizeps','Wadenmuskel',2],['Welcher Muskel streckt den Ellenbogen?','Bizeps','Trizeps','Kaumuskel',2]]
];let points=Number(localStorage.getItem('bq_points')||0),done=JSON.parse(localStorage.getItem('bq_done')||'{}'),unit=0,q=0,score=0;const app=document.getElementById('app');function update(){document.getElementById('points').textContent=points+' Lernpunkte · '+Object.keys(done).length+'/7 Missionen'}function home(){update();app.innerHTML='<article><h2>Deine 7 Lernwelten</h2><p>Wähle eine Mission. Lies die Erklärung und beantworte die Fragen.</p></article>'+units.map((u,i)=>'<button data-unit="'+i+'">'+u[0]+(done[i]?' ✓':'')+'</button>').join('')+'<article><button class="primary" id="test">🏆 Abschlussprüfung starten</button></article>';document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>lesson(+b.dataset.unit));document.getElementById('test').onclick=()=>exam()}
function lesson(i){unit=i;q=0;score=0;app.innerHTML='<article><h2>'+units[i][0]+'</h2><p>'+units[i][1]+'</p><button class="primary" id="start">Fragen beantworten</button><button id="back">Zur Übersicht</button></article>';document.getElementById('start').onclick=question;document.getElementById('back').onclick=home}
function question(){const x=units[unit][q+2];app.innerHTML='<article><small>Mission '+(unit+1)+' · Frage '+(q+1)+'/2</small><h2>'+x[0]+'</h2>'+x.slice(1,4).map((a,i)=>'<button data-a="'+(i+1)+'">'+a+'</button>').join('')+'<div id="feedback"></div></article>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(document.getElementById('feedback').innerHTML)return;const ok=+b.dataset.a===x[4];if(ok)score++;document.querySelectorAll('[data-a]').forEach(t=>{t.disabled=true;if(+t.dataset.a===x[4])t.classList.add('correct');else if(t===b)t.classList.add('wrong')});document.getElementById('feedback').innerHTML='<p><strong>'+(ok?'Richtig!':'Noch nicht ganz.')+'</strong> Die richtige Antwort ist: '+x[x[4]]+'.</p><button class="primary" id="next">Weiter</button>';document.getElementById('next').onclick=()=>{q++;if(q<2)question();else finish()}})}
function finish(){if(!done[unit]){done[unit]=true;points+=score*20+20;localStorage.setItem('bq_done',JSON.stringify(done));localStorage.setItem('bq_points',points)}app.innerHTML='<article><h2>🏅 Mission geschafft!</h2><p>'+score+' von 2 Antworten richtig.</p><button class="primary" id="home">Zur Übersicht</button></article>';document.getElementById('home').onclick=home;update()}
function exam(){let items=units.flatMap(u=>u.slice(2).map(x=>x));let n=0,s=0;function show(){if(n===items.length){app.innerHTML='<article><h2>🏆 Prüfung beendet</h2><p>'+s+' von '+items.length+' Antworten richtig.</p><button class="primary" id="back">Zur Übersicht</button></article>';document.getElementById('back').onclick=home;return}let x=items[n];app.innerHTML='<article><small>Frage '+(n+1)+'/'+items.length+'</small><h2>'+x[0]+'</h2>'+x.slice(1,4).map((a,i)=>'<button data-a="'+(i+1)+'">'+a+'</button>').join('')+'<div id="f"></div></article>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(document.getElementById('f').innerHTML)return;if(+b.dataset.a===x[4])s++;document.querySelectorAll('[data-a]').forEach(t=>{t.disabled=true;if(+t.dataset.a===x[4])t.classList.add('correct');else if(t===b)t.classList.add('wrong')});document.getElementById('f').innerHTML='<p>Richtige Antwort: '+x[x[4]]+'</p><button class="primary" id="next">Weiter</button>';document.getElementById('next').onclick=()=>{n++;show()}})}show()}home();

const more=[
[['Welche Aufgabe hat das Skelett?','Es schützt Organe und stützt den Körper','Es verdaut Nahrung','Es erzeugt Licht',1],['Was gehört zum Rumpfskelett?','Finger','Brustkorb und Wirbelsäule','Zehen',2]],
[['Welche Schicht umgibt den Knochen?','Knochenhaut','Gelenkschmiere','Bandscheibe',1],['Wozu dienen Blutgefäße im Knochen?','Zur Versorgung','Zum Sehen','Zum Hören',1]],
[['Wie viele Brustwirbel gibt es?','7','12','5',2],['Was schützt der Wirbelkanal?','Das Rückenmark','Das Herz','Die Leber',1]],
[['Was kann das Fußgewölbe abfedern?','Stöße beim Gehen','Sonnenlicht','Geräusche',1],['Wohin verlagern hohe Absätze das Gewicht?','Nach vorn','Auf den Hinterkopf','Auf die Arme',1]],
[['Was stabilisiert ein Gelenk?','Bänder','Haare','Zähne',1],['Welcher Gelenktyp ist die Schulter?','Kugelgelenk','Scharniergelenk','Sattelgelenk',1]],
[['Wie viele Muskeln hat der Mensch ungefähr?','Über 600','Nur 20','Genau 50',1],['Was steuert Muskelbewegungen?','Nerven','Zähne','Knochenmark',1]],
[['Können Muskeln aktiv schieben?','Ja','Nein, nur ziehen','Nur nachts',2],['Was passiert beim Beugen mit dem Trizeps?','Er wird gedehnt','Er bildet Knochen','Er wird zum Gelenk',1]]
];

'<svg viewBox="0 0 340 220" role="img" aria-label="Vereinfachtes Skelett mit Schädel, Rippen, Wirbelsäule, Armen und Beinen"><g fill="none" stroke="#317b79" stroke-width="7" stroke-linecap="round"><circle cx="170" cy="34" r="24" fill="#f5e7ca"/><path d="M170 59V148M128 80L212 80M128 80L105 125L90 163M212 80L235 125L250 163M170 146L136 202M170 146L204 202"/><path d="M143 68Q170 58 197 68L211 116Q170 139 129 116Z" stroke-width="4"/><path d="M137 85Q170 98 203 85M134 100Q170 113 206 100M141 115Q170 126 199 115" stroke-width="3"/></g><g fill="#1a6268"><circle cx="161" cy="32" r="3"/><circle cx="179" cy="32" r="3"/></g></svg>',
'<svg viewBox="0 0 340 220" role="img" aria-label="Längsschnitt eines Röhrenknochens mit Knochenmark"><rect x="132" y="18" width="76" height="184" rx="37" fill="#e4c994" stroke="#986f46" stroke-width="5"/><rect x="151" y="49" width="38" height="124" rx="16" fill="#f7e4a8"/><rect x="157" y="75" width="26" height="75" rx="10" fill="#ce766a"/><path d="M135 42l25 24m44-24l-25 24m-44 112l25-24m44 24l-25-24" stroke="#b28a56" stroke-width="4"/><g font-size="13" fill="#31565b"><text x="217" y="86">Knochenwand</text><text x="217" y="127">Markhöhle</text><path d="M189 80h24M183 123h30" stroke="#31565b"/></g></svg>',
'<svg viewBox="0 0 340 220" role="img" aria-label="Doppelte S-Form der Wirbelsäule"><path d="M165 16Q214 48 171 90Q133 126 170 155Q200 177 164 208" stroke="#bfd8d5" stroke-width="35" fill="none"/><path d="M165 16Q214 48 171 90Q133 126 170 155Q200 177 164 208" stroke="#247b77" stroke-width="12" fill="none" stroke-dasharray="13 5"/><text x="220" y="44" font-size="15" fill="#235c60">Hals</text><text x="220" y="107" font-size="15" fill="#235c60">Brust</text><text x="220" y="171" font-size="15" fill="#235c60">Lende</text></svg>',
'<svg viewBox="0 0 340 220" role="img" aria-label="Fußgewölbe als tragender Bogen"><path d="M55 154Q102 137 136 113Q177 88 218 125L287 154Q303 167 285 177H59Q37 172 55 154Z" fill="#f0d6b6" stroke="#af8664" stroke-width="4"/><path d="M60 186H286" stroke="#266c72" stroke-width="5"/><path d="M70 183Q170 104 270 183" fill="none" stroke="#1e9b8c" stroke-width="5" stroke-dasharray="9 7"/><text x="111" y="207" fill="#28666b" font-size="14">Fußgewölbe federt</text></svg>',
'<svg viewBox="0 0 340 220" role="img" aria-label="Schematisches Gelenk mit Knorpel und Gelenkspalt"><path d="M120 15h100v69q0 25-50 35q-50-10-50-35Z" fill="#e9c995" stroke="#a87e4b" stroke-width="4"/><path d="M125 136q45-24 90 0v70h-90Z" fill="#e9c995" stroke="#a87e4b" stroke-width="4"/><path d="M123 106q47 27 94 0M125 142q45-24 90 0" stroke="#58b6c1" stroke-width="11" fill="none"/><ellipse cx="170" cy="124" rx="69" ry="43" stroke="#317b79" stroke-width="4" fill="none"/><text x="242" y="117" fill="#28666b" font-size="14">Knorpel</text><path d="M215 109l23 3" stroke="#28666b"/></svg>',
'<svg viewBox="0 0 340 220" role="img" aria-label="Muskel mit Sehnen an beiden Enden und Muskelfasern"><path d="M35 111L100 111Q170 29 240 111L305 111" fill="none" stroke="#d6b68a" stroke-width="13" stroke-linecap="round"/><path d="M94 111Q170 30 246 111Q170 192 94 111Z" fill="#db756a" stroke="#b74b50" stroke-width="4"/><g stroke="#f4b5a2" stroke-width="3" fill="none"><path d="M110 111Q170 55 230 111M110 111Q170 167 230 111M130 111Q170 75 210 111M130 111Q170 147 210 111"/></g><text x="143" y="202" fill="#28666b" font-size="15">Muskelfasern</text></svg>',
'<svg viewBox="0 0 340 220" role="img" aria-label="Bizeps und Trizeps als Gegenspieler am gebeugten Arm"><circle cx="108" cy="53" r="19" fill="#e4c69f"/><path d="M108 74L130 132L223 90" stroke="#e4c69f" stroke-width="27" stroke-linecap="round" fill="none"/><path d="M119 85Q163 90 141 125" stroke="#da6664" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M95 85Q107 123 130 137" stroke="#62b2bc" stroke-width="12" fill="none" stroke-linecap="round"/><text x="169" y="163" fill="#b84d4c" font-size="17">Bizeps zieht</text><text x="169" y="186" fill="#317c88" font-size="17">Trizeps dehnt</text></svg>'
];
const originalHome=home,originalLesson=lesson;
home=function(){update();const completed=Object.keys(done).length;app.innerHTML='<article><h2>🚀 Deine Lernmission</h2><p>Erkunde den Körper, trainiere dein Wissen und meistere die Abschlussprüfung.</p><div class="statbar" role="progressbar" aria-label="Lernfortschritt" aria-valuemin="0" aria-valuemax="7" aria-valuenow="'+completed+'"><div style="width:'+(completed/7*100)+'%"></div></div><p class="small">'+completed+' von 7 Lernwelten abgeschlossen</p></article>'+units.map((u,i)=>'<button class="topic" data-unit="'+i+'"><span>'+u[0]+'</span><span class="pill">'+(done[i]?'✓ Gelernt':'Starten')+'</span></button>').join('')+'<article><h2>🎯 Training</h2><div class="two"><button id="practice">🔁 Extra-Training</button><button id="test">🏆 Abschlussprüfung</button></div><p class="small">Extra-Training: 14 weitere Fragen aus allen Themen.</p></article><footer>BioQuest · Klasse 6 · Lernstand nur auf diesem Gerät gespeichert</footer>';document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>lesson(+b.dataset.unit));document.getElementById('test').onclick=exam;document.getElementById('practice').onclick=practice};
lesson=function(i){unit=i;q=0;score=0;app.innerHTML='<article><p class="quizmeta">LERNWELT '+(i+1)+' VON 7</p><h2>'+units[i][0]+'</h2><div class="hero-art">'+art[i]+'</div><p class="caption">Vereinfachte Lernzeichnung – nicht maßstabsgetreu</p><div class="fact"><strong>Das solltest du wissen</strong><p>'+units[i][1]+'</p></div><button class="primary" id="start">🧠 Wissen überprüfen</button><button id="back">← Zur Übersicht</button></article>';document.getElementById('start').onclick=question;document.getElementById('back').onclick=home};
function practice(){let items=more.flatMap(x=>x);let n=0,s=0;function show(){if(n===items.length){app.innerHTML='<article><h2>🎉 Training geschafft!</h2><p>'+s+' von '+items.length+' Fragen richtig.</p><p>'+(s>=11?'Sehr gut! Du kennst die Themen schon sicher.':'Lies die Erklärungen der Lernwelten noch einmal und versuche es erneut.')+'</p><button class="primary" id="back">Zur Übersicht</button></article>';document.getElementById('back').onclick=home;return}let x=items[n];app.innerHTML='<article><p class="quizmeta">EXTRA-TRAINING · '+(n+1)+' / '+items.length+'</p><div class="statbar"><div style="width:'+(n/items.length*100)+'%"></div></div><h2>'+x[0]+'</h2>'+x.slice(1,4).map((a,i)=>'<button data-a="'+(i+1)+'">'+a+'</button>').join('')+'<div id="f"></div></article>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(document.getElementById('f').innerHTML)return;if(+b.dataset.a===x[4])s++;document.querySelectorAll('[data-a]').forEach(t=>{t.disabled=true;if(+t.dataset.a===x[4])t.classList.add('correct');else if(t===b)t.classList.add('wrong')});document.getElementById('f').innerHTML='<p>Richtige Antwort: <strong>'+x[x[4]]+'</strong></p><button class="primary" id="next">Nächste Frage →</button>';document.getElementById('next').onclick=()=>{n++;show()}})}show()}

// Robuste Ereignissteuerung auch bei dynamisch neu aufgebauten Lernkarten.
document.addEventListener('click',function(event){
  const target=event.target.closest('[data-unit]');
  if(target && target.closest('#app')){event.preventDefault();lesson(Number(target.dataset.unit));}
});
home();
</script></html>
