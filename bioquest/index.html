<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioQuest – Klasse 6</title><style>body{font:17px system-ui;background:#edf4f4;color:#17333c;margin:0}main{max-width:650px;margin:auto;padding:18px}header{background:#134b56;color:white;padding:25px;border-radius:18px}h1{margin:4px 0}article{background:white;border-radius:15px;padding:19px;margin:13px 0;box-shadow:0 2px 9px #0001}button{display:block;width:100%;padding:15px;margin:9px 0;border:1px solid #bfd2d2;border-radius:12px;background:white;color:#17333c;text-align:left;font:inherit;cursor:pointer;min-height:48px}button.primary{background:#146f67;color:white;text-align:center;font-weight:bold}.small{color:#5b7378;font-size:14px}.correct{background:#dcf5e4}.wrong{background:#fce1e1}p{line-height:1.6}</style><main><header><small>BIOQUEST · BIOLOGIE · OBS KLASSE 6</small><h1>🦴 Mission Körperbau</h1><div id="points">0 Lernpunkte</div></header><section id="app"></section></main><script>
const units=[
['🦴 Das Skelett','Das Skelett stützt den Körper, schützt wichtige Organe und ermöglicht mit Gelenken und Muskeln Bewegung. Es besteht aus Kopfskelett, Rumpfskelett und Gliedmaßenskelett.',['Was schützt der Schädel?','Das Gehirn','Die Lunge','Den Magen',1],['Was gehört zum Gliedmaßenskelett?','Arme und Beine','Rippen','Schädel',1]],
['🔬 Knochenaufbau','Röhrenknochen besitzen einen festen Knochenschaft und eine Markhöhle. Knochenbälkchen machen die Knochen leicht und stabil. Die Knochenhaut enthält Nerven und Blutgefäße. Rotes Knochenmark bildet Blutzellen.',['Warum sind Knochen leicht und stabil?','Wegen der Knochenbälkchen','Wegen der Gelenkschmiere','Wegen der Bandscheiben',1],['Was entsteht im roten Knochenmark?','Sehnen','Blutzellen','Gelenkknorpel',2]],
['🧍 Die Wirbelsäule','Die Wirbelsäule hat 7 Halswirbel, 12 Brustwirbel und 5 Lendenwirbel sowie Kreuzbein und Steißbein. Ihre doppelte S-Form federt Stöße ab. Bandscheiben liegen zwischen den beweglichen Wirbeln. Der Wirbelkanal schützt das Rückenmark.',['Wie viele Halswirbel gibt es?','5','7','12',2],['Wozu dienen Bandscheiben?','Stöße abfedern','Blut bilden','Knochen wachsen lassen',1]],
['🦶 Das Fußgewölbe','Das Fußgewölbe ähnelt einer Bogenbrücke. Es verteilt das Gewicht und federt Stöße ab. Beim Senkfuß ist die Wölbung abgesenkt. Hohe Absätze verlagern Gewicht nach vorne.',['Wozu dient das Fußgewölbe?','Es federt Stöße ab','Es bildet Blutzellen','Es bewegt den Kopf',1],['Was ist ein Senkfuß?','Ein Fuß ohne Zehen','Ein abgesenktes Fußgewölbe','Ein Fuß ohne Gelenke',2]],
['⚙️ Gelenke','Gelenke verbinden Knochen beweglich. Gelenkkopf und Gelenkpfanne passen zusammen. Knorpel und Gelenkschmiere vermindern Reibung. Die Gelenkkapsel umschließt das Gelenk, Bänder stabilisieren es. Gelenktypen: Scharnier (Ellenbogen), Kugel (Schulter), Dreh (Hals) und Sattel (Daumen).',['Welches Gelenk sitzt am Ellenbogen?','Kugelgelenk','Scharniergelenk','Sattelgelenk',2],['Was vermindert Reibung im Gelenk?','Knorpel und Gelenkschmiere','Knochenmark','Rückenmark',1]],
['💪 Muskeln und Sehnen','Der Körper besitzt über 600 Muskeln. Muskeln bestehen aus Muskelfaserbündeln und Muskelfasern. Sehnen verbinden Muskeln mit Knochen. Muskeln ziehen sich zusammen und verkürzen sich. Nerven steuern die Bewegung. Für die Arbeit benötigen Muskeln Energie, Sauerstoff und Nährstoffe.',['Was verbindet Muskel und Knochen?','Sehne','Bandscheibe','Gelenkschmiere',1],['Was macht ein Muskel beim Zusammenziehen?','Er verkürzt sich','Er wird zu Knochen','Er löst sich auf',1]],
['🏋️ Gegenspielerprinzip','Bizeps und Trizeps sind Gegenspieler. Beim Beugen zieht sich der Bizeps zusammen und der Trizeps wird gedehnt. Beim Strecken zieht sich der Trizeps zusammen und der Bizeps wird gedehnt. Muskeln können aktiv ziehen, aber nicht schieben.',['Welcher Muskel beugt den Ellenbogen?','Trizeps','Bizeps','Wadenmuskel',2],['Welcher Muskel streckt den Ellenbogen?','Bizeps','Trizeps','Kaumuskel',2]]
];let points=Number(localStorage.getItem('bq_points')||0),done=JSON.parse(localStorage.getItem('bq_done')||'{}'),unit=0,q=0,score=0;const app=document.getElementById('app');function update(){document.getElementById('points').textContent=points+' Lernpunkte · '+Object.keys(done).length+'/7 Missionen'}function home(){update();app.innerHTML='<article><h2>Deine 7 Lernwelten</h2><p>Wähle eine Mission. Lies die Erklärung und beantworte die Fragen.</p></article>'+units.map((u,i)=>'<button data-unit="'+i+'">'+u[0]+(done[i]?' ✓':'')+'</button>').join('')+'<article><button class="primary" id="test">🏆 Abschlussprüfung starten</button></article>';document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>lesson(+b.dataset.unit));document.getElementById('test').onclick=()=>exam()}
function lesson(i){unit=i;q=0;score=0;app.innerHTML='<article><h2>'+units[i][0]+'</h2><p>'+units[i][1]+'</p><button class="primary" id="start">Fragen beantworten</button><button id="back">Zur Übersicht</button></article>';document.getElementById('start').onclick=question;document.getElementById('back').onclick=home}
function question(){const x=units[unit][q+2];app.innerHTML='<article><small>Mission '+(unit+1)+' · Frage '+(q+1)+'/2</small><h2>'+x[0]+'</h2>'+x.slice(1,4).map((a,i)=>'<button data-a="'+(i+1)+'">'+a+'</button>').join('')+'<div id="feedback"></div></article>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(document.getElementById('feedback').innerHTML)return;const ok=+b.dataset.a===x[4];if(ok)score++;document.querySelectorAll('[data-a]').forEach(t=>{t.disabled=true;if(+t.dataset.a===x[4])t.classList.add('correct');else if(t===b)t.classList.add('wrong')});document.getElementById('feedback').innerHTML='<p><strong>'+(ok?'Richtig!':'Noch nicht ganz.')+'</strong> Die richtige Antwort ist: '+x[x[4]]+'.</p><button class="primary" id="next">Weiter</button>';document.getElementById('next').onclick=()=>{q++;if(q<2)question();else finish()}})}
function finish(){if(!done[unit]){done[unit]=true;points+=score*20+20;localStorage.setItem('bq_done',JSON.stringify(done));localStorage.setItem('bq_points',points)}app.innerHTML='<article><h2>🏅 Mission geschafft!</h2><p>'+score+' von 2 Antworten richtig.</p><button class="primary" id="home">Zur Übersicht</button></article>';document.getElementById('home').onclick=home;update()}
function exam(){let items=units.flatMap(u=>u.slice(2).map(x=>x));let n=0,s=0;function show(){if(n===items.length){app.innerHTML='<article><h2>🏆 Prüfung beendet</h2><p>'+s+' von '+items.length+' Antworten richtig.</p><button class="primary" id="back">Zur Übersicht</button></article>';document.getElementById('back').onclick=home;return}let x=items[n];app.innerHTML='<article><small>Frage '+(n+1)+'/'+items.length+'</small><h2>'+x[0]+'</h2>'+x.slice(1,4).map((a,i)=>'<button data-a="'+(i+1)+'">'+a+'</button>').join('')+'<div id="f"></div></article>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(document.getElementById('f').innerHTML)return;if(+b.dataset.a===x[4])s++;document.querySelectorAll('[data-a]').forEach(t=>{t.disabled=true;if(+t.dataset.a===x[4])t.classList.add('correct');else if(t===b)t.classList.add('wrong')});document.getElementById('f').innerHTML='<p>Richtige Antwort: '+x[x[4]]+'</p><button class="primary" id="next">Weiter</button>';document.getElementById('next').onclick=()=>{n++;show()}})}show()}home();
</script></html>
