name: KlassenCheck Qualität
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mathematische Aufgaben und Diagnose prüfen
        run: node --test learning/*.test.mjs
      - name: HTML und eingebundene Module prüfen
        run: node --test tests/*.test.mjs
