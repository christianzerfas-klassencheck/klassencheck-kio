name: KlassenCheck Qualität
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mathematische Aufgaben und Diagnose prüfen
        run: node --test learning/*.test.mjs
      - name: HTML und eingebundene Module prüfen
        run: node --test tests/*.test.mjs
  browser-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright-Bibliothek installieren (Browser im Container vorhanden)
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: iPhone- und Android-Browser prüfen
        run: node tests/mobile-browser.mjs
      - name: Screenshots bei Fehlern sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klassencheck-mobile-screenshots
          path: test-results/mobile/
          if-no-files-found: ignore

  fehlerbericht:
    name: Fehlerbericht automatisch in GitHub erfassen
    needs: [test, browser-smoke]
    if: ${{ always() && github.event_name != 'pull_request' && (needs.test.result == 'failure' || needs.browser-smoke.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Fehlerhafte Jobs als GitHub-Issue dokumentieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          def gh(*args,input=None):
              return subprocess.run(['gh',*args],input=input,text=True,capture_output=True,check=True).stdout
          repo=os.environ['GH_REPO']
          run=os.environ['RUN_ID']
          jobs=json.loads(gh('api',f'repos/{repo}/actions/runs/{run}/jobs','--paginate'))['jobs']
          failed=[j for j in jobs if j.get('conclusion')=='failure']
          lines=[
            'Automatisch erfasster KlassenCheck-Fehler. Keine manuellen Screenshots erforderlich.',
            '',
            f"**Workflow:** {os.environ['RUN_URL']}",
            f"**Commit:** `{os.environ['COMMIT_SHA']}`",
            f"**Node-Tests:** {os.environ['TEST_RESULT']}",
            f"**Browser-Tests:** {os.environ['BROWSER_RESULT']}",
            '',
            '### Fehlgeschlagene Jobs und Schritte',
          ]
          for job in failed:
              lines.append(f"- **{job['name']}** · Job-ID `{job['id']}` · [Protokoll]({job['html_url']})")
              for step in job.get('steps',[]):
                  if step.get('conclusion')=='failure':
                      lines.append(f"  - Fehlgeschlagener Schritt: {step['name']}")
          lines.extend(['','Die Job-IDs erlauben den direkten Abruf der Protokolle über die verbundene GitHub-Schnittstelle.'])
          title=f"[KlassenCheck CI] Fehlgeschlagener Testlauf #{run}"
          gh('issue','create','--repo',repo,'--title',title,'--body','\n'.join(lines))
          print('GitHub-Issue mit Job-IDs und Fehlerstellen erstellt.')
          PY
