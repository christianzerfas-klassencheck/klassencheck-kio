name: KlassenCheck Qualität
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mathematische Aufgaben und Diagnose prüfen
        run: node --test learning/*.test.mjs
      - name: HTML und eingebundene Module prüfen
        run: node --test tests/*.test.mjs
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright bereitstellen
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: iPhone- und Android-Browser prüfen
        run: node tests/mobile-browser.mjs
      - name: Screenshots bei Fehlern sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klassencheck-mobile-screenshots
          path: test-results/mobile/
          if-no-files-found: ignore
